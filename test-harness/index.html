<!doctype html>
<html><head><meta charset="utf-8"><title>StreamRatings Harness</title>
<style>
body{font:14px system-ui;margin:24px;max-width:960px;background:#141414;color:#eee}
input{padding:6px;width:320px}button{padding:6px 12px;margin-right:6px}
#grid{display:grid;grid-template-columns:repeat(6,140px);gap:12px;margin-top:16px}
.card{width:140px;height:200px;background:#333;border-radius:6px;display:flex;align-items:flex-end;padding:8px;box-sizing:border-box;font-size:12px}
#spacer{height:3000px}
pre{background:#222;padding:10px;white-space:pre-wrap}
</style>
<link rel="stylesheet" href="../extension/ui/badge.css">
</head><body>
<h1>StreamRatings end-to-end test</h1>
<p>1. Paste your OMDb key and Save (kept only in this page's storage). 2. Click Run. Only the 6 on-screen cards should hit OMDb; reload + Run again should make 0 requests.</p>
<input id="key" type="password" placeholder="OMDb API key"> <button id="save">Save key</button> <span id="keystatus"></span>
<p><button id="run">Run</button><button id="runQuota">Run with simulated quota limit</button><button id="clear">Clear cache</button></p>
<pre id="log">idle</pre>
<div id="grid"></div>
<div id="spacer"></div>
<div id="below" style="display:grid;grid-template-columns:repeat(6,140px);gap:12px"></div>
<script>
// Visible cards: real titles. Below-the-fold cards: must NOT be fetched until scrolled to.
const VISIBLE = ["Inception", "Stranger Things", "Panchayat", "Always Home", "Kanguva", "zzqx nonexistent title 123"];
const BELOW = Array.from({length: 24}, (_, i) => "Offscreen Title " + i);
const mk = (parent, t) => { const d = document.createElement('div'); d.className = 'card'; d.dataset.title = t; d.textContent = t; parent.appendChild(d); };
VISIBLE.forEach(t => mk(document.getElementById('grid'), t));
BELOW.forEach(t => mk(document.getElementById('below'), t));

const store = {
  read() { try { return JSON.parse(localStorage.getItem('sr_store') || '{}'); } catch { return {}; } },
  write(o) { try { localStorage.setItem('sr_store', JSON.stringify(o)); } catch {} }
};
const keyStatus = () => { document.getElementById('keystatus').textContent = store.read().sr_config ? 'key saved ✓' : 'no key'; };
keyStatus();
document.getElementById('save').onclick = () => {
  const s = store.read(); s.sr_config = { omdbApiKey: document.getElementById('key').value.trim() }; store.write(s);
  document.getElementById('key').value = ''; keyStatus();
};
document.getElementById('clear').onclick = () => {
  const s = store.read(); for (const k of Object.keys(s)) if (k.startsWith('sr_cache_')) delete s[k]; store.write(s);
  document.getElementById('log').textContent = 'cache cleared';
};

// chrome.* shim backed by localStorage so the real extension files run unmodified
const listeners = [];
window.chrome = {
  storage: { local: {
    async get(k) { const s = store.read(); if (k === null) return s; const keys = Array.isArray(k) ? k : [k]; const o = {}; keys.forEach(x => { if (x in s) o[x] = s[x]; }); return o; },
    set(obj, cb) { const s = store.read(); Object.assign(s, obj); store.write(s); cb && cb(); return Promise.resolve(); }
  }},
  runtime: {
    lastError: null,
    onInstalled: { addListener() {} },
    onMessage: { addListener(fn) { listeners.push(fn); } },
    sendMessage(msg, cb) { listeners[0](msg, {}, cb); }
  }
};

// Count every OMDb request (and optionally simulate the daily limit without spending quota)
window.__omdbCalls = 0;
window.__simulateQuota = false;
const realFetch = window.fetch.bind(window);
window.fetch = (url, opts) => {
  if (String(url).includes('omdbapi.com')) {
    window.__omdbCalls++;
    if (window.__simulateQuota) {
      return Promise.resolve(new Response(JSON.stringify({ Response: "False", Error: "Request limit reached!" }), { status: 401 }));
    }
  }
  return realFetch(url, opts);
};

// Adapter for the fake cards
window.StreamRatingsAdapter = {
  findCards: () => document.querySelectorAll('.card'),
  extractTitle: c => c.dataset.title,
  extractYear: () => null
};

function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src + '?t=' + Date.now(); s.onload = res; s.onerror = rej; document.body.appendChild(s); }); }

async function run(simulateQuota) {
  window.__simulateQuota = simulateQuota;
  window.__omdbCalls = 0;
  await loadScript('../extension/content_scripts/cache_policy.js');
  await loadScript('../extension/background/service_worker.js');
  await loadScript('../extension/ui/badge.js');
  await loadScript('../extension/content_scripts/main.js');
  // main.js scans after 2s, then requests go out sequentially every ~500ms
  await new Promise(r => setTimeout(r, 2000 + VISIBLE.length * 3 * 800 + 1500));
  const badges = [...document.querySelectorAll('.card')].map(c => ({ title: c.dataset.title, badge: c.querySelector('.sr-badge')?.textContent, note: c.querySelector('.sr-badge')?.title || '' }));
  const cached = Object.entries(store.read()).filter(([k]) => k.startsWith('sr_cache_'))
    .map(([k, v]) => ({ key: k.slice(9), found: v.data.found, rating: v.data.imdbRating, released: v.data.released, refreshDays: StreamRatingsCachePolicy.ttlDays(v.data), ageMin: Math.round((Date.now() - v.ts) / 60000) }));
  window.__report = { omdbCalls: window.__omdbCalls, visible: badges.slice(0, VISIBLE.length), offscreenLoaded: badges.slice(VISIBLE.length).filter(b => b.badge !== '…').length, cached };
  document.getElementById('log').textContent = JSON.stringify(window.__report, null, 2);
  return window.__report;
}
window.__run = run;
document.getElementById('run').onclick = () => run(false);
document.getElementById('runQuota').onclick = () => run(true);
</script></body></html>
